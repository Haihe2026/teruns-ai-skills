name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Skill copies match shared/
        run: python3 tools/sync_shared.py --check
      - name: JSON manifests parse
        run: |
          for f in plugin.json catalog.json .claude-plugin/plugin.json .claude-plugin/marketplace.json .agents/plugins/marketplace.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok $f"
          done
      - name: Scripts compile
        run: python3 -m py_compile shared/*.py tools/*.py
      - name: SKILL.md frontmatter
        run: python3 tools/check_skills.py
      - name: Client and audit against the mock API
        run: bash tools/smoke_test.sh
